<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mundo Motriz JC | Mantenimiento automotriz</title>

  <!-- Bootstrap e iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Estilos del sitio -->
  <link href="styles.css" rel="stylesheet">
</head>
<body class="login-body">
<main>
<section id="login" class="login-page py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-5">

            <div id="vistaLogin">
              <div class="login-panel">
                <h1 class="section-title text-center mb-4">Inicio de sesión</h1>
              <form id="formLogin" class="login-form card shadow-sm p-4" novalidate>
                <div class="mb-3">
                  <label for="loginUsuario" class="form-label">Usuario</label>
                  <input type="text" class="form-control" id="loginUsuario" autocomplete="username" placeholder="Ej: julian" required>
                </div>
                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Contraseña</label>
                  <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-accent w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
              </form>

              <!-- Cuentas para probar el sistema -->
              <div class="login-credentials card mt-3">
                <div class="card-body">
                  <h6 class="card-title"><i class="bi bi-info-circle text-accent"></i> Credenciales de prueba</h6>
                  <div class="table-responsive">
                    <table class="table table-sm mb-0 small">
                      <thead><tr><th>Usuario</th><th>Contraseña</th><th>Rol</th><th>Cuenta</th></tr></thead>
                      <tbody id="credencialesPrueba"></tbody>
                    </table>
                  </div>
                </div>
              </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
